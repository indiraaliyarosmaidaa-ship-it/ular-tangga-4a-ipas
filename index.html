<!doctype html>
<html lang="id">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ular Tangga Perubahan Wujud Benda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Fredoka', sans-serif; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
    html, body { height: 100vh; margin: 0; padding: 0; width: 100%; overflow: hidden; background: #f0f9ff; }
    
    /* Layout Utama */
    .app-wrap { display: flex; flex-direction: column; height: 100vh; width: 100%; }
    
    .game-container { 
      display: flex; 
      flex: 1; 
      overflow: hidden; 
      padding: 10px; 
      gap: 15px; 
      background: linear-gradient(135deg, #fef3c7, #fbcfe8, #ddd6fe, #bfdbfe);
    }
    
    /* Papan Full Screen */
    .board-wrapper { 
      flex: 1; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      height: 100%;
    }
    
    #board { 
      display: grid; 
      grid-template-columns: repeat(6, 1fr); 
      gap: 6px; 
      width: 100%; 
      max-width: 85vh; /* Mengunci ukuran papan agar proporsional dengan tinggi layar */
      aspect-ratio: 6 / 5;
      background: rgba(255, 255, 255, 0.3);
      padding: 8px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .board-cell {
      position: relative;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: clamp(14px, 2.5vh, 24px);
      border: 3px solid rgba(255, 255, 255, 0.6);
      aspect-ratio: 1;
      transition: transform 0.2s;
    }

    /* Sidebar minimalis */
    .sidebar { width: 260px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
    
    .pion { 
      position: absolute; 
      border-radius: 50%; 
      border: 2px solid #fff; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.3); 
      transition: all 0.4s cubic-bezier(.34,1.56,.64,1); 
      z-index: 10; 
      width: clamp(15px, 3vh, 30px); 
      height: clamp(15px, 3vh, 30px); 
    }

    .dice-face { 
      width: 90px; height: 90px; 
      background: #fff; border-radius: 18px; 
      display: grid; padding: 12px; 
      box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
      border: 4px solid #fbbf24;
      cursor: pointer;
    }
    .dice-face:active { transform: scale(0.95); }
    .dot { width: 16px; height: 16px; background: #1e293b; border-radius: 50%; }

    @keyframes diceRoll { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
    .dice-rolling { animation: diceRoll 0.4s linear infinite; }

    .btn-roll { 
      background: linear-gradient(135deg, #10b981, #3b82f6); 
      color: white; font-weight: 800; 
      padding: 15px; border-radius: 50px; 
      font-size: 1.2rem; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    .cell-emoji { position: absolute; font-size: 1.4rem; bottom: 2px; right: 2px; }

    @media (max-width: 1024px) {
      .game-container { flex-direction: column; overflow-y: auto; }
      .sidebar { width: 100%; order: -1; }
      #board { max-width: 95vw; }
    }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  </style>
 </head>
 <body>

  <div class="app-wrap">
    <header class="bg-white/90 px-6 py-2 flex justify-between items-center shadow-sm">
      <h1 class="text-xl font-bold text-blue-600">🎲 Game Ular Tangga</h1>
      <button onclick="location.reload()" class="bg-red-100 text-red-600 px-3 py-1 rounded-lg font-bold text-sm">Reset</button>
    </header>

    <div class="game-container">
      <div class="board-wrapper">
        <div id="board"></div>
      </div>

      <div class="sidebar">
        <div class="bg-white/80 backdrop-blur p-4 rounded-2xl shadow-md text-center">
          <p id="turnLabel" class="font-bold text-lg mb-2">Giliran: <span class="text-red-500">Merah</span></p>
          <div class="flex justify-center mb-4">
            <div id="dice" class="dice-face" onclick="rollDice()" title="Klik untuk kocok dadu">
              <div style="grid-area: 2/2" class="dot"></div>
            </div>
          </div>
          <button onclick="rollDice()" id="rollBtn" class="btn-roll w-full">KOCOK DADU</button>
        </div>

        <div class="bg-white/80 backdrop-blur p-4 rounded-2xl shadow-md flex-1 overflow-auto">
          <p class="font-bold text-sm text-gray-500 mb-2 uppercase tracking-widest">Skor Pemain</p>
          <div id="playerCards" class="flex flex-col gap-2"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="questionOverlay" class="overlay hidden">
    <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl">
      <div class="text-center mb-4 text-4xl">🤔</div>
      <p id="qText" class="text-xl font-bold text-center mb-6 text-gray-800"></p>
      <div id="qOptions" class="flex flex-col gap-3"></div>
    </div>
  </div>

  <script>
    const ALL_QUESTIONS = [
      {q:"Es batu mencair karena terkena...", o:["Dingin","Panas","Angin","Lampu"], a:1},
      {q:"Benda gas memiliki sifat...", o:["Tetap","Mengisi ruang","Keras","Terlihat"], a:1},
      {q:"Uap air berubah jadi titik air disebut...", o:["Mencair","Membeku","Mengembun","Menyublim"], a:2},
      {q:"Lilin yang dibakar akan...", o:["Membeku","Mencair","Menyublim","Menguap"], a:1},
      {q:"Contoh benda padat adalah...", o:["Asap","Meja","Minyak","Susu"], a:1}
    ];

    const TOTAL = 30, COLS = 6, ROWS = 5;
    const COLORS = ['#FFADAD', '#FFD6A5', '#FDFFB6', '#CAFFBF', '#9BF6FF', '#A0C4FF'];
    const PLAYER_COLORS = ['#ef4444', '#3b82f6'];
    const SNAKES = {17:7, 24:14, 29:11};
    const LADDERS = {3:12, 8:26, 15:25};

    let players = [{pos:1, score:0}, {pos:1, score:0}];
    let currentPlayer = 0;
    let isRolling = false;

    // Inisialisasi Papan Langsung
    function init() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      for (let i = 1; i <= TOTAL; i++) {
        const cell = document.createElement('div');
        cell.className = 'board-cell';
        cell.id = 'cell-' + i;
        cell.style.backgroundColor = COLORS[i % COLORS.length];
        
        const row = Math.floor((i-1)/COLS);
        const label = (i === 1) ? "START" : (i === 30) ? "FINISH" : i;
        cell.innerHTML = `<span>${label}</span>`;
        
        if(SNAKES[i]) cell.innerHTML += `<span class="cell-emoji">🐍</span>`;
        if(LADDERS[i]) cell.innerHTML += `<span class="cell-emoji">🪜</span>`;
        
        board.appendChild(cell);
      }
      placePions();
      updateUI();
    }

    function placePions() {
      document.querySelectorAll('.pion').forEach(p => p.remove());
      players.forEach((p, i) => {
        const cell = document.getElementById('cell-' + p.pos);
        const pion = document.createElement('div');
        pion.className = 'pion';
        pion.style.backgroundColor = PLAYER_COLORS[i];
        pion.style.transform = `translate(${i * 10}px, ${i * 10}px)`;
        cell.appendChild(pion);
      });
    }

    function updateUI() {
      const label = document.getElementById('turnLabel');
      label.innerHTML = `Giliran: <span style="color:${PLAYER_COLORS[currentPlayer]}">Pemain ${currentPlayer + 1}</span>`;
      
      const cards = document.getElementById('playerCards');
      cards.innerHTML = players.map((p, i) => `
        <div class="p-3 rounded-xl border-2 ${i === currentPlayer ? 'border-blue-500 bg-blue-50' : 'bg-gray-50'}">
          <div class="font-bold" style="color:${PLAYER_COLORS[i]}">Pemain ${i+1}</div>
          <div class="text-xs">Kotak: ${p.pos} | Skor: ${p.score}</div>
        </div>
      `).join('');
    }

    async function rollDice() {
      if(isRolling) return;
      isRolling = true;
      const dice = document.getElementById('dice');
      dice.classList.add('dice-rolling');
      
      await new Promise(r => setTimeout(r, 600));
      const val = Math.floor(Math.random() * 6) + 1;
      dice.classList.remove('dice-rolling');
      
      // Update visual dadu
      dice.innerHTML = '';
      const patterns = {
        1:[[2,2]], 2:[[1,3],[3,1]], 3:[[1,1],[2,2],[3,3]], 
        4:[[1,1],[1,3],[3,1],[3,3]], 5:[[1,1],[1,3],[2,2],[3,1],[3,3]], 6:[[1,1],[1,3],[2,1],[2,3],[3,1],[3,3]]
      };
      dice.style.display = 'grid';
      dice.style.gridTemplate = 'repeat(3, 1fr) / repeat(3, 1fr)';
      patterns[val].forEach(pos => {
        const d = document.createElement('div');
        d.className = 'dot';
        d.style.gridArea = `${pos[0]} / ${pos[1]}`;
        dice.appendChild(d);
      });

      movePlayer(val);
    }

    async function movePlayer(val) {
      let p = players[currentPlayer];
      const target = Math.min(p.pos + val, TOTAL);
      
      while(p.pos < target) {
        p.pos++;
        placePions();
        await new Promise(r => setTimeout(r, 200));
      }

      if(p.pos === TOTAL) {
        alert("Pemain " + (currentPlayer + 1) + " Menang! 🎉");
        location.reload();
        return;
      }

      showQuestion();
    }

    function showQuestion() {
      const q = ALL_QUESTIONS[Math.floor(Math.random() * ALL_QUESTIONS.length)];
      document.getElementById('qText').innerText = q.q;
      const opts = document.getElementById('qOptions');
      opts.innerHTML = '';
      
      q.o.forEach((o, i) => {
        const btn = document.createElement('button');
        btn.className = "w-full p-4 bg-blue-50 hover:bg-blue-100 rounded-2xl font-bold border-2 border-blue-100 transition";
        btn.innerText = o;
        btn.onclick = () => {
          if(i === q.a) players[currentPlayer].score += 10;
          document.getElementById('questionOverlay').classList.add('hidden');
          finalizeTurn();
        };
        opts.appendChild(btn);
      });
      document.getElementById('questionOverlay').classList.remove('hidden');
    }

    function finalizeTurn() {
      let p = players[currentPlayer];
      if(SNAKES[p.pos]) { p.pos = SNAKES[p.pos]; alert("Ups! Kena Ular! 🐍"); }
      if(LADDERS[p.pos]) { p.pos = LADDERS[p.pos]; alert("Hore! Naik Tangga! 🪜"); }
      
      placePions();
      currentPlayer = (currentPlayer + 1) % players.length;
      isRolling = false;
      updateUI();
    }

    init();
  </script>
 </body>
</html>
