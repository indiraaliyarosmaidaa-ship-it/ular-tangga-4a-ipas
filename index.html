<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ular Tangga Perubahan Wujud Benda</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    *{font-family:'Fredoka',sans-serif;box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:auto}
    .app-wrap{height:100%;width:100%;background:linear-gradient(135deg,#fef3c7,#fbcfe8,#ddd6fe,#bfdbfe);overflow:auto; min-height: 100vh;}
    .board-cell{position:relative;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(11px,1.8vw,18px);border:3px solid rgba(255,255,255,.5);transition:transform .2s;cursor:default;aspect-ratio:1;overflow:visible}
    .board-cell:hover{transform:scale(1.08);z-index:2}
    .board-cell .cell-num{position:relative;z-index:2}
    .pion{position:absolute;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:all .4s cubic-bezier(.34,1.56,.64,1);z-index:10;width:clamp(14px,2.2vw,26px);height:clamp(14px,2.2vw,26px)}
    .dice-face{width:80px;height:80px;background:#fff;border-radius:16px;display:grid;padding:12px;box-shadow:0 4px 20px rgba(0,0,0,.15);border:3px solid #fbbf24}
    .dot{width:14px;height:14px;background:#1e293b;border-radius:50%}
    @keyframes diceRoll{0%{transform:rotateZ(0) scale(1)}25%{transform:rotateZ(90deg) scale(1.2)}50%{transform:rotateZ(180deg) scale(.9)}75%{transform:rotateZ(270deg) scale(1.1)}100%{transform:rotateZ(360deg) scale(1)}}
    .dice-rolling{animation:diceRoll .5s ease-in-out}
    @keyframes popIn{0%{transform:scale(0) rotate(-10deg);opacity:0}60%{transform:scale(1.15) rotate(2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
    .pop-in{animation:popIn .4s ease-out forwards}
    .btn-primary{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;font-weight:700;padding:12px 28px;border-radius:50px;border:none;font-size:18px;cursor:pointer;box-shadow:0 4px 15px rgba(239,68,68,.3);transition:all .2s}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(239,68,68,.4)}
    .player-card{border-radius:16px;padding:10px 14px;border:3px solid transparent;transition:all .3s}
    .player-card.active{border-color:#fbbf24;box-shadow:0 0 20px rgba(251,191,36,.4);transform:scale(1.05)}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
    .toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);border-radius:24px;padding:32px 48px;z-index:200;text-align:center;font-size:28px;font-weight:700;box-shadow:0 10px 40px rgba(0,0,0,.3);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
    .toast.show{transform:translate(-50%,-50%) scale(1)}
    .toast-correct{background:linear-gradient(135deg,#10b981,#34d399);color:#fff}
    .toast-wrong{background:linear-gradient(135deg,#ef4444,#f87171);color:#fff}
    .cell-emoji{position:absolute;font-size:clamp(10px,1.5vw,16px);bottom:1px;right:2px;z-index:1;opacity:.7}
  </style>
 </head>
 <body class="h-full">
  <div class="app-wrap" id="appWrap">
   <div id="setupScreen" class="flex items-center justify-center h-full p-4">
    <div class="bg-white/90 backdrop-blur rounded-3xl shadow-2xl p-8 max-w-md w-full text-center pop-in">
     <div class="text-5xl mb-3">🎲🐍🪜</div>
     <h1 class="text-2xl md:text-3xl font-bold bg-gradient-to-r from-orange-500 via-pink-500 to-purple-500 bg-clip-text text-transparent mb-2">Ular Tangga</h1>
     <p class="text-lg text-gray-600 mb-6">Perubahan Wujud Benda 🧊☀️💧</p>
     <label class="block text-left font-semibold text-gray-700 mb-2 text-lg">Jumlah Pemain:</label>
     <div class="flex gap-3 justify-center mb-6">
      <button onclick="setPlayers(2)" class="player-select px-6 py-3 rounded-2xl font-bold text-lg border-2 border-purple-300 bg-purple-100 text-purple-700 hover:bg-purple-200 transition ring-4 ring-yellow-400" data-n="2">2</button> 
      <button onclick="setPlayers(3)" class="player-select px-6 py-3 rounded-2xl font-bold text-lg border-2 border-blue-300 bg-blue-100 text-blue-700 hover:bg-blue-200 transition" data-n="3">3</button> 
      <button onclick="setPlayers(4)" class="player-select px-6 py-3 rounded-2xl font-bold text-lg border-2 border-green-300 bg-green-100 text-green-700 hover:bg-green-200 transition" data-n="4">4</button>
     </div>
     <button onclick="startGame()" class="btn-primary text-xl w-full">🎮 Mulai Bermain!</button>
    </div>
   </div>

   <div id="gameScreen" class="hidden h-full">
    <div class="flex flex-col h-full">
     <header class="flex items-center justify-between px-4 py-2 bg-white/80 backdrop-blur shadow-md flex-shrink-0">
      <h1 class="font-bold text-lg md:text-xl bg-gradient-to-r from-orange-500 to-pink-500 bg-clip-text text-transparent truncate">🎲 Ular Tangga Wujud Benda</h1>
      <div class="flex gap-2 items-center">
       <button onclick="resetGame()" class="p-2 rounded-full hover:bg-gray-200 transition text-red-500"><i data-lucide="rotate-ccw"></i></button>
      </div>
     </header>
     <div class="flex flex-col lg:flex-row flex-1 overflow-auto p-3 gap-3">
      <div class="flex-1 flex items-start justify-center">
       <div class="w-full max-w-[600px]">
        <div id="board" class="grid grid-cols-6 gap-1.5 relative"></div>
       </div>
      </div>
      <div class="lg:w-72 w-full flex flex-col gap-3 flex-shrink-0">
       <div class="bg-white/90 backdrop-blur rounded-2xl shadow-lg p-4 text-center">
        <p class="font-bold text-gray-600 mb-1 text-sm" id="turnLabel">Giliran: Pemain 1</p>
        <div class="flex justify-center mb-3">
         <div id="dice" class="dice-face" style="display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);place-items:center"></div>
        </div>
        <button onclick="rollDice()" id="rollBtn" class="btn-primary w-full py-3">🎲 Lempar Dadu!</button>
       </div>
       <div id="playerCards" class="bg-white/90 backdrop-blur rounded-2xl shadow-lg p-4 flex-1 overflow-auto flex flex-col gap-2"></div>
      </div>
     </div>
    </div>
   </div>

   <div id="questionOverlay" class="overlay hidden">
    <div class="bg-white rounded-3xl p-6 max-w-lg w-full pop-in mx-4">
     <h2 class="font-bold text-xl text-purple-700 mb-4">❓ Pertanyaan</h2>
     <p id="qText" class="text-lg font-semibold mb-4"></p>
     <div id="qOptions" class="flex flex-col gap-2"></div>
    </div>
   </div>
   <div id="toast" class="toast"></div>
   <div id="winOverlay" class="overlay hidden">
    <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center pop-in">
     <div class="text-6xl mb-3">🏆</div>
     <h2 class="text-3xl font-bold text-yellow-600 mb-2">Selamat!</h2>
     <p id="winText" class="text-xl mb-4"></p>
     <button onclick="resetGame()" class="btn-primary">🔄 Main Lagi</button>
    </div>
   </div>
  </div>

  <script>
    // Konfigurasi Dasar
    const ALL_QUESTIONS = [
        {q:"Padat menjadi cair disebut…",o:["Membeku","Mencair","Mengembun","Menyublim"],a:1},
        {q:"Es batu di tempat terbuka akan…",o:["Membeku","Mencair","Menguap","Menyublim"],a:1},
        {q:"Air mendidih berubah menjadi…",o:["Es","Minyak","Uap air","Embun"],a:2},
        {q:"Cair menjadi gas disebut…",o:["Menguap","Membeku","Mencair","Mengembun"],a:0},
        {q:"Contoh membeku adalah…",o:["Air jadi es","Es jadi air","Air jadi uap","Kapur barus habis"],a:0},
        {q:"Uap air menjadi titik air disebut…",o:["Menguap","Membeku","Mengembun","Menyublim"],a:2}
    ];

    const SNAKES = {17:7, 24:14, 29:11, 20:6};
    const LADDERS = {3:12, 8:26, 15:25, 19:28};
    const PLAYER_COLORS = ['#ef4444','#3b82f6','#10b981','#f59e0b','#8b5cf6'];
    const PLAYER_EMOJIS = ['🔴','🔵','🟢','🟡','🟣'];

    let numPlayers = 2, players = [], currentPlayer = 0, gameActive = false, rolling = false;

    function setPlayers(n) {
      numPlayers = n;
      document.querySelectorAll('.player-select').forEach(b => {
        b.classList.remove('ring-4', 'ring-yellow-400');
        if(parseInt(b.dataset.n) === n) b.classList.add('ring-4', 'ring-yellow-400');
      });
    }

    function buildBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      for (let n = 1; n <= 30; n++) {
        // Logika Zig-zag
        const row = Math.floor((n-1)/6);
        const col = (n-1)%6;
        const isEvenRow = row % 2 === 0;
        const visualCol = isEvenRow ? col : (5 - col);
        const visualRow = 4 - row;

        const cell = document.createElement('div');
        cell.className = 'board-cell';
        cell.id = 'cell-' + n;
        cell.style.gridColumnStart = visualCol + 1;
        cell.style.gridRowStart = visualRow + 1;
        cell.style.background = (n % 2 === 0) ? '#fff7ed' : '#ffedd5';
        
        let label = n;
        if(n===1) label="Mulai";
        if(n===30) label="Finish";
        
        cell.innerHTML = `<span class="cell-num">${label}</span>`;
        if(SNAKES[n]) cell.innerHTML += `<span class="cell-emoji">🐍</span>`;
        if(LADDERS[n]) cell.innerHTML += `<span class="cell-emoji">🪜</span>`;
        board.appendChild(cell);
      }
    }

    function startGame() {
      players = [];
      for(let i=0; i<numPlayers; i++) players.push({pos:1, score:0});
      currentPlayer = 0;
      gameActive = true;
      document.getElementById('setupScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');
      buildBoard();
      placePions();
      renderPlayerCards();
      updateTurnLabel();
      renderDice(1);
      lucide.createIcons();
    }

    function placePions() {
      document.querySelectorAll('.pion').forEach(p => p.remove());
      players.forEach((p, i) => {
        const cell = document.getElementById('cell-' + p.pos);
        const pion = document.createElement('div');
        pion.className = 'pion';
        pion.style.background = PLAYER_COLORS[i];
        pion.style.left = '50%';
        pion.style.top = '50%';
        pion.style.transform = `translate(-50%, -50%) translate(${(i-2)*4}px, ${(i-2)*4}px)`;
        cell.appendChild(pion);
      });
    }

    async function rollDice() {
      if(!gameActive || rolling) return;
      rolling = true;
      const btn = document.getElementById('rollBtn');
      btn.disabled = true;

      const dice = document.getElementById('dice');
      dice.classList.add('dice-rolling');
      
      let val = 1;
      for(let i=0; i<10; i++) {
        val = Math.floor(Math.random()*6)+1;
        renderDice(val);
        await new Promise(r => setTimeout(r, 50));
      }
      dice.classList.remove('dice-rolling');
      
      let p = players[currentPlayer];
      let oldPos = p.pos;
      p.pos += val;
      if(p.pos > 30) p.pos = 30;

      // Animasi gerak sederhana
      placePions();

      if(p.pos === 30) {
        showWin();
        return;
      }

      showQuestion();
    }

    function showQuestion() {
      const q = ALL_QUESTIONS[Math.floor(Math.random()*ALL_QUESTIONS.length)];
      document.getElementById('qText').textContent = q.q;
      const opts = document.getElementById('qOptions');
      opts.innerHTML = '';
      q.o.forEach((o, i) => {
        const b = document.createElement('button');
        b.className = "w-full text-left p-3 border-2 rounded-xl hover:bg-purple-50 transition font-bold";
        b.textContent = o;
        b.onclick = () => {
          if(i === q.a) {
            players[currentPlayer].score += 10;
            showToast("Benar! +10 Poin", "correct");
          } else {
            showToast("Salah!", "wrong");
          }
          document.getElementById('questionOverlay').classList.add('hidden');
          checkSnakesLadders();
        };
        opts.appendChild(b);
      });
      document.getElementById('questionOverlay').classList.remove('hidden');
    }

    function checkSnakesLadders() {
      let p = players[currentPlayer];
      if(SNAKES[p.pos]) {
        p.pos = SNAKES[p.pos];
        showToast("Yah, ada ular! Turun!", "wrong");
      } else if(LADDERS[p.pos]) {
        p.pos = LADDERS[p.pos];
        showToast("Hebat, ada tangga! Naik!", "correct");
      }
      
      placePions();
      currentPlayer = (currentPlayer + 1) % numPlayers;
      rolling = false;
      document.getElementById('rollBtn').disabled = false;
      renderPlayerCards();
      updateTurnLabel();
    }

    function renderDice(val) {
      const dice = document.getElementById('dice');
      dice.innerHTML = '';
      const dotPos = {
        1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8]
      };
      for(let i=0; i<9; i++) {
        const d = document.createElement('div');
        if(dotPos[val].includes(i)) d.className = 'dot';
        dice.appendChild(d);
      }
    }

    function renderPlayerCards() {
      const container = document.getElementById('playerCards');
      container.innerHTML = '';
      players.forEach((p, i) => {
        const card = document.createElement('div');
        card.className = `player-card flex items-center gap-3 ${i===currentPlayer?'active':''}`;
        card.style.background = PLAYER_COLORS[i] + '20';
        card.innerHTML = `<span>${PLAYER_EMOJIS[i]}</span><div><b>Pemain ${i+1}</b><br><small>Skor: ${p.score}</small></div>`;
        container.appendChild(card);
      });
    }

    function updateTurnLabel() {
      document.getElementById('turnLabel').innerHTML = `Giliran: <b>Pemain ${currentPlayer+1}</b>`;
    }

    function showToast(m, t) {
      const el = document.getElementById('toast');
      el.textContent = m;
      el.className = `toast toast-${t} show`;
      setTimeout(() => el.classList.remove('show'), 1500);
    }

    function showWin() {
        document.getElementById('winText').textContent = `Pemain ${currentPlayer+1} Menang!`;
        document.getElementById('winOverlay').classList.remove('hidden');
    }

    function resetGame() {
      location.reload();
    }

    lucide.createIcons();
  </script>
 </body>
</html>
