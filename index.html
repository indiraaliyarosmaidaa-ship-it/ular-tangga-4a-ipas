<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ular Tangga Perubahan Wujud Benda</title>

  <!-- FIXED TAILWIND -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      font-family:'Fredoka',sans-serif;
      box-sizing:border-box;
      -webkit-user-select:none;
      user-select:none
    }

    /* FIXED OVERFLOW */
    html,body{
      height:100%;
      margin:0;
      padding:0;
      width:100%;
      overflow:auto
    }

    body{
      background:linear-gradient(135deg,#fef3c7,#fbcfe8,#ddd6fe,#bfdbfe)
    }

    .app-wrap{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column
    }

    .board-cell{
      position:relative;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      font-size:clamp(11px,1.8vw,18px);
      border:3px solid rgba(255,255,255,.5);
      transition:transform .2s;
      cursor:pointer;
      aspect-ratio:1;
      overflow:visible
    }

    .board-cell:hover{
      transform:scale(1.08);
      z-index:2
    }

    .board-cell .cell-num{
      position:relative;
      z-index:2
    }

    .pion{
      position:absolute;
      border-radius:50%;
      border:2px solid #fff;
      box-shadow:0 2px 6px rgba(0,0,0,.3);
      transition:all .4s cubic-bezier(.34,1.56,.64,1);
      z-index:10;
      width:clamp(14px,2.2vw,26px);
      height:clamp(14px,2.2vw,26px);
      cursor:grab
    }

    .dice-face{
      width:80px;
      height:80px;
      background:#fff;
      border-radius:16px;
      display:grid;
      padding:12px;
      box-shadow:0 4px 20px rgba(0,0,0,.15);
      border:3px solid #fbbf24
    }

    .dot{
      width:14px;
      height:14px;
      background:#1e293b;
      border-radius:50%
    }

    @keyframes diceRoll{
      0%{transform:rotateZ(0) scale(1)}
      25%{transform:rotateZ(90deg) scale(1.2)}
      50%{transform:rotateZ(180deg) scale(.9)}
      75%{transform:rotateZ(270deg) scale(1.1)}
      100%{transform:rotateZ(360deg) scale(1)}
    }

    .dice-rolling{
      animation:diceRoll .5s ease-in-out
    }

    .overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.5);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:50;
      padding:16px
    }

    .btn-primary{
      background:linear-gradient(135deg,#f59e0b,#ef4444);
      color:#fff;
      font-weight:700;
      padding:12px 28px;
      border-radius:50px;
      border:none;
      font-size:18px;
      cursor:pointer
    }

    .player-card{
      border-radius:16px;
      padding:10px 14px
    }

    #gameScreen{
      flex:1;
      overflow:auto
    }

    #setupScreen{
      display:flex;
      align-items:center;
      justify-content:center;
      flex:1
    }
  </style>
</head>

<body>

<div class="app-wrap" id="appWrap">

  <!-- SETUP -->
  <div id="setupScreen">

    <div class="bg-white/90 rounded-3xl shadow-2xl p-8 max-w-md w-full text-center">

      <div class="text-5xl mb-3">
        🎲🐍🪜
      </div>

      <h1 class="text-3xl font-bold mb-2 text-orange-500">
        Ular Tangga
      </h1>

      <p class="text-lg text-gray-600 mb-6">
        Perubahan Wujud Benda
      </p>

      <label class="block text-left font-semibold mb-2">
        Jumlah Pemain:
      </label>

      <div class="flex gap-3 justify-center mb-6 flex-wrap">

        <button onclick="setPlayers(2)" class="player-select px-6 py-3 rounded-2xl bg-purple-100">
          2 👫
        </button>

        <button onclick="setPlayers(3)" class="player-select px-6 py-3 rounded-2xl bg-blue-100">
          3 👨‍👩‍👧
        </button>

        <button onclick="setPlayers(4)" class="player-select px-6 py-3 rounded-2xl bg-green-100">
          4 👨‍👩‍👧‍👦
        </button>

        <button onclick="setPlayers(5)" class="player-select px-6 py-3 rounded-2xl bg-orange-100">
          5 🎉
        </button>

      </div>

      <button onclick="startGame()" class="btn-primary w-full">
        🎮 Mulai Bermain!
      </button>

    </div>
  </div>

  <!-- GAME -->
  <div id="gameScreen" class="hidden">

    <header class="flex items-center justify-between px-4 py-2 bg-white/80 shadow-md">

      <h1 class="font-bold text-lg">
        🎲 Ular Tangga Wujud Benda
      </h1>

      <div class="flex gap-2">

        <button onclick="toggleMusic()" id="musicBtn">
          <i data-lucide="volume-2"></i>
        </button>

        <button onclick="resetGame()" class="text-red-500">
          <i data-lucide="rotate-ccw"></i>
        </button>

      </div>

    </header>

    <div class="flex flex-col lg:flex-row flex-1 overflow-auto p-3 gap-3">

      <div class="flex-1 flex items-start justify-center">

        <div class="w-full max-w-[600px]">

          <div id="board" class="grid grid-cols-6 gap-1.5 relative"></div>

        </div>

      </div>

      <div class="lg:w-72 w-full flex flex-col gap-3">

        <div class="bg-white/90 rounded-2xl shadow-lg p-4 text-center">

          <p class="font-bold text-gray-600 mb-1" id="turnLabel">
            Giliran: Pemain 1
          </p>

          <div class="flex justify-center mb-3">

            <div id="dice" class="dice-face"></div>

          </div>

          <button onclick="rollDice()" id="rollBtn" class="btn-primary w-full">
            🎲 Lempar Dadu!
          </button>

        </div>

        <div class="bg-white/90 rounded-2xl shadow-lg p-4 flex-1 overflow-auto">

          <p class="font-bold text-gray-600 mb-2">
            📊 Skor Pemain
          </p>

          <div id="playerCards" class="flex flex-col gap-2"></div>

        </div>

      </div>

    </div>

  </div>

</div>

<!-- SOAL -->
<div id="questionOverlay" class="overlay hidden">

  <div class="bg-white rounded-3xl shadow-2xl p-6 max-w-lg w-full">

    <h2 class="font-bold text-xl text-purple-700 mb-4">
      ❓ Soal Perubahan Wujud
    </h2>

    <p id="qText" class="text-lg font-semibold mb-4"></p>

    <div id="qOptions" class="flex flex-col gap-2"></div>

  </div>

</div>

<script>

const QUESTIONS = [
  {
    q:"Padat menjadi cair disebut…",
    o:["Membeku","Mencair","Mengembun","Menyublim"],
    a:1
  },
  {
    q:"Es batu di tempat terbuka akan…",
    o:["Membeku","Mencair","Menguap","Menyublim"],
    a:1
  },
  {
    q:"Air mendidih berubah menjadi…",
    o:["Es","Minyak","Uap air","Embun"],
    a:2
  }
];

const PLAYER_COLORS = ['#ef4444','#3b82f6','#10b981','#f59e0b','#8b5cf6'];

let numPlayers = 2;
let currentPlayer = 0;
let players = [];

function setPlayers(n){
  numPlayers = n;
}

function startGame(){

  /* FIXED AUDIO AUTOPLAY */
  document.body.addEventListener('click', () => {
    initAudio();
  }, { once:true });

  players = [];

  for(let i=0;i<numPlayers;i++){
    players.push({
      pos:1,
      score:0
    });
  }

  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');

  buildBoard();
  renderPlayers();
  renderDice(1);

  /* FIXED LUCIDE */
  if(window.lucide){
    lucide.createIcons();
  }
}

function buildBoard(){

  const board = document.getElementById('board');
  board.innerHTML = '';

  for(let i=1;i<=30;i++){

    const cell = document.createElement('div');

    cell.className = 'board-cell';

    cell.style.background =
      `hsl(${i*12},80%,75%)`;

    cell.id = 'cell-'+i;

    cell.innerHTML =
      `<span class="cell-num">${i}</span>`;

    board.appendChild(cell);
  }
}

function renderPlayers(){

  document.querySelectorAll('.pion').forEach(p=>p.remove());

  players.forEach((p,i)=>{

    const cell = document.getElementById('cell-'+p.pos);

    if(!cell) return;

    const pion = document.createElement('div');

    pion.className = 'pion';

    pion.style.background = PLAYER_COLORS[i];

    pion.style.left = (10 + (i*8)) + 'px';

    pion.style.top = (10 + (i*8)) + 'px';

    cell.appendChild(pion);

  });

  renderCards();
}

function renderCards(){

  const wrap = document.getElementById('playerCards');

  wrap.innerHTML = '';

  players.forEach((p,i)=>{

    const div = document.createElement('div');

    div.className = 'player-card';

    div.style.background = PLAYER_COLORS[i] + '22';

    div.innerHTML =
      `
      <b style="color:${PLAYER_COLORS[i]}">
        Pemain ${i+1}
      </b>
      <br>
      Kotak ${p.pos}
      <br>
      ⭐ ${p.score}
      `;

    wrap.appendChild(div);
  });

  document.getElementById('turnLabel').innerHTML =
    `Giliran: Pemain ${currentPlayer+1}`;
}

function renderDice(val){

  const dice = document.getElementById('dice');

  dice.innerHTML = `<div style="
    font-size:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100%;
  ">${val}</div>`;
}

async function rollDice(){

  const val =
    Math.floor(Math.random()*6)+1;

  renderDice(val);

  let p = players[currentPlayer];

  for(let i=0;i<val;i++){

    await new Promise(r=>setTimeout(r,300));

    if(p.pos < 30){
      p.pos++;
    }

    renderPlayers();
  }

  showQuestion();
}

function showQuestion(){

  const q =
    QUESTIONS[
      Math.floor(Math.random()*QUESTIONS.length)
    ];

  document.getElementById('questionOverlay')
    .classList.remove('hidden');

  document.getElementById('qText')
    .textContent = q.q;

  const wrap =
    document.getElementById('qOptions');

  wrap.innerHTML = '';

  q.o.forEach((opt,i)=>{

    const btn =
      document.createElement('button');

    btn.className =
      'border rounded-xl px-4 py-3 text-left hover:bg-purple-100';

    btn.textContent = opt;

    btn.onclick = ()=>{

      if(i===q.a){
        players[currentPlayer].score += 10;
        alert('✅ Benar!');
      }else{
        alert('❌ Salah!');
      }

      document.getElementById('questionOverlay')
        .classList.add('hidden');

      currentPlayer =
        (currentPlayer+1)%numPlayers;

      renderCards();
    };

    wrap.appendChild(btn);
  });
}

function resetGame(){
  location.reload();
}

let audioCtx = null;

function initAudio(){

  if(!audioCtx){

    audioCtx =
      new(window.AudioContext ||
      window.webkitAudioContext)();
  }
}

function toggleMusic(){
  alert('Musik aktif/nonaktif');
}

/* FIXED LUCIDE */
if(window.lucide){
  lucide.createIcons();
}

</script>

</body>
</html>
