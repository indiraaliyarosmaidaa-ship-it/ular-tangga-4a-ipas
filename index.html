*{font-family:'Fredoka',sans-serif;box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;padding:0;width:100%;overflow:auto}
body{background:linear-gradient(135deg,#fef3c7,#fbcfe8,#ddd6fe,#bfdbfe)}
.app-wrap{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column}
.board-cell{position:relative;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(11px,1.8vw,18px);border:3px solid rgba(255,255,255,.5);transition:transform .2s;cursor:pointer;aspect-ratio:1;overflow:visible}

.dice-face{width:80px;height:80px;background:#fff;border-radius:16px;display:grid;padding:12px;box-shadow:0 4px 20px rgba(0,0,0,.15);border:3px solid #fbbf24}
.dot{width:14px;height:14px;background:#1e293b;border-radius:50%}

.dice-rolling{animation:diceRoll .5s ease-in-out}
@keyframes popIn{0%{transform:scale(0) rotate(-10deg);opacity:0}60%{transform:scale(1.15) rotate(2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.pop-in{animation:popIn .4s ease-out forwards}
@keyframes starBurst{0%{transform:scale(0) rotate(0);opacity:1}50%{transform:scale(1.5) rotate(180deg);opacity:.8}100%{transform:scale(0) rotate(360deg);opacity:0}}
.star-particle{animation:starBurst .8s ease-out forwards;position:fixed;pointer-events:none;z-index:100;top:50%;left:50%}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(120px) rotate(720deg);opacity:0}}
.confetti-piece{position:fixed;width:8px;height:8px;border-radius:2px;animation:confettiFall 1.5s ease-out forwards;pointer-events:none;z-index:100}
@keyframes snakeWiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.snake-icon{animation:snakeWiggle .6s ease-in-out infinite}
@keyframes ladderShine{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
.ladder-icon{animation:ladderShine 1s ease-in-out infinite}
@keyframes slideDown{0%{transform:translateY(-20px);opacity:0}100%{transform:translateY(0);opacity:1}}
.slide-down{animation:slideDown .3s ease-out}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.btn-primary{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;font-weight:700;padding:12px 28px;border-radius:50px;border:none;font-size:18px;cursor:pointer;box-shadow:0 4px 15px rgba(239,68,68,.3);transition:all .2s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn-primary:active{transform:translateY(0);opacity:0.95}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-roll{background:linear-gradient(135deg,#10b981,#3b82f6);font-size:20px;padding:14px 36px}
.btn-roll:active{box-shadow:0 6px 20px rgba(59,130,246,.4)}
.player-card{border-radius:16px;padding:10px 14px;border:3px solid transparent;transition:all .3s}
.player-card.active{border-color:#fbbf24;box-shadow:0 0 20px rgba(251,191,36,.4);transform:scale(1.05)}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);border-radius:24px;padding:32px 48px;z-index:200;text-align:center;font-size:28px;font-weight:700;box-shadow:0 10px 40px rgba(0,0,0,.3);transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.toast.show{transform:translate(-50%,-50%) scale(1)}
.toast-correct{background:linear-gradient(135deg,#10b981,#34d399);color:#fff}
.toast-wrong{background:linear-gradient(135deg,#ef4444,#f87171);color:#fff}
.cell-emoji{position:absolute;font-size:clamp(10px,1.5vw,16px);bottom:1px;right:2px;z-index:1;opacity:.7}
#gameScreen{flex:1;overflow:auto}
#setupScreen{display:flex;align-items:center;justify-content:center;flex:1}

  <script>
document.body.addEventListener('click', () => {
  if (typeof initAudio === 'function') initAudio();
}, { once:true });

let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
      return false;
    }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return true;
}

function playTone(freq, dur, type = 'sine', vol = 0.15) {
  try {
    if (!initAudio()) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

function sfxDice() {
  [200, 300, 400, 500].forEach((f, i) => setTimeout(() => playTone(f, 0.08, 'square', 0.08), i * 60));
}
function sfxCorrect() {
  playTone(523, 0.15);
  setTimeout(() => playTone(659, 0.15), 120);
  setTimeout(() => playTone(784, 0.25), 240);
}
function sfxWrong() {
  playTone(200, 0.3, 'sawtooth', 0.1);
  setTimeout(() => playTone(150, 0.4, 'sawtooth', 0.08), 200);
}
function sfxSnake() {
  [400, 350, 300, 250, 200].forEach((f, i) => setTimeout(() => playTone(f, 0.12, 'sawtooth', 0.06), i * 80));
}
function sfxLadder() {
  [300, 400, 500, 600, 700].forEach((f, i) => setTimeout(() => playTone(f, 0.1, 'triangle', 0.1), i * 70));
}
function sfxWin() {
  [523, 587, 659, 784, 880, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.2), i * 120));
}
function sfxStep() {
  playTone(440 + Math.random() * 200, 0.06, 'sine', 0.05);
}

let musicOn = false, musicInterval = null;
function toggleMusic() {
  musicOn = !musicOn;
  const btn = document.getElementById('musicBtn');
  if (musicOn) {
    btn.innerHTML = '<i data-lucide="volume-2" style="width:20px;height:20px"></i>';
    startMusic();
  } else {
    btn.innerHTML = '<i data-lucide="volume-x" style="width:20px;height:20px"></i>';
    stopMusic();
  }
  if (window.lucide) lucide.createIcons();
}

function startMusic() {
  if (musicInterval) return;
  const melody = [262, 294, 330, 349, 392, 349, 330, 294];
  let i = 0;
  musicInterval = setInterval(() => {
    playTone(melody[i % melody.length], 0.2, 'sine', 0.03);
    i++;
  }, 400);
}

function stopMusic() {
  clearInterval(musicInterval);
  musicInterval = null;
}

  {q:"Sifat benda gas adalah…",o:["Bentuk tetap","Volume tetap","Mengisi seluruh ruang","Keras"],a:2},
  {q:"Pakaian dijemur agar airnya…",o:["Membeku","Mencair","Menguap","Mengembun"],a:2},
  {q:"Embun pagi terjadi karena…",o:["Mencair","Mengembun","Membeku","Menyublim"],a:1},
  {q:"Es krim terkena panas akan…",o:["Membeku","Mencair","Menyublim","Mengembun"],a:1},
  {q:"Perubahan wujud yang memerlukan panas adalah…",o:["Membeku","Mengembun","Mencair","Mengeras"],a:2},
  {q:"Perubahan wujud yang melepaskan panas adalah…",o:["Mencair","Menguap","Membeku","Menyublim"],a:2},
  {q:"Gelembung air mendidih berisi…",o:["Pasir","Udara","Uap air","Minyak"],a:2},
  {q:"Perubahan wujud terjadi karena perubahan…",o:["Warna","Suhu","Bentuk meja","Ukuran rumah"],a:1},
  {q:"Gas menjadi cair jika mengalami…",o:["Pemanasan","Pendinginan","Pembakaran","Pengeringan"],a:1},
  {q:"Contoh perubahan wujud sehari-hari adalah…",o:["Batu dilempar","Kayu dipotong","Es batu mencair","Buku dibaca"],a:2},
  {q:"Perubahan wujud yang benar adalah…",o:["Es menjadi batu","Air menjadi uap","Kayu menjadi besi","Kaca menjadi kain"],a:1}
];

const COLS = 6, ROWS = 5, TOTAL = 30;
const CELL_COLORS = ['#fca5a5','#fdba74','#fcd34d','#86efac','#7dd3fc','#c4b5fd','#f9a8d4','#a5b4fc','#6ee7b7','#fbbf24'];
const CELL_EMOJIS = ['🧊','☀️','💧','🌡️','❄️','🌤️','🔥','💨','🌧️','🕯️','🧈','☁️','🌫️','⛄','🫧'];
const PLAYER_COLORS = ['#ef4444','#3b82f6','#10b981','#f59e0b','#8b5cf6'];
const PLAYER_NAMES = ['Merah','Biru','Hijau','Kuning','Ungu'];
const PLAYER_EMOJIS = ['🔴','🔵','🟢','🟡','🟣'];
const SNAKES = {17:7, 24:14, 29:11, 20:6};
const LADDERS = {3:12, 8:26, 15:25, 19:28};

let numPlayers = 2, players = [], currentPlayer = 0, gameActive = false, rolling = false, shuffledQs = [], qIndex = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function setPlayers(n) {
  numPlayers = n;
  document.querySelectorAll('.player-select').forEach(b => {
    b.classList.remove('ring-4', 'ring-yellow-400');
    if (parseInt(b.dataset.n) === n) b.classList.add('ring-4', 'ring-yellow-400');
  });
}

function cellToGrid(cellNum) {
  const idx = cellNum - 1;
  const row = Math.floor(idx / COLS);
  const col = idx % COLS;
  const actualRow = ROWS - 1 - row;
  const actualCol = (row % 2 === 0) ? col : (COLS - 1 - col);
  return {row: actualRow, col: actualCol};
}

function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const cells = new Array(ROWS).fill(null).map(() => new Array(COLS).fill(null));
  for (let n = 1; n <= TOTAL; n++) {
    const {row, col} = cellToGrid(n);
    const div = document.createElement('div');
    div.className = 'board-cell';
    div.id = 'cell-' + n;
    div.style.background = CELL_COLORS[(n - 1) % CELL_COLORS.length];
    let label = n === 1 ? '🚀 START' : n === 30 ? '🏁 FINISH' : n;
    let extra = '';
    if (n === 1) div.style.background = 'linear-gradient(135deg,#34d399,#10b981)';
    if (n === 30) div.style.background = 'linear-gradient(135deg,#fbbf24,#f59e0b)';
    if (SNAKES[n]) extra = `<span class="cell-emoji snake-icon">🐍</span>`;
    if (LADDERS[n]) extra = `<span class="cell-emoji ladder-icon">🪜</span>`;
    if (!extra && n > 1 && n < 30) extra = `<span class="cell-emoji">${CELL_EMOJIS[(n - 1) % CELL_EMOJIS.length]}</span>`;
    div.innerHTML = `<span class="cell-num" style="font-size:${n === 1 || n === 30 ? 'clamp(8px,1.2vw,12px)' : 'clamp(11px,1.8vw,18px)'}">${label}</span>${extra}`;
    cells[row][col] = {n, div};
  }
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (cells[r][c]) board.appendChild(cells[r][c].div);
    }
  }
}

function placePions() {
  document.querySelectorAll('.pion').forEach(p => p.remove());
  const counts = {};
  players.forEach((p, i) => {
    if (!counts[p.pos]) counts[p.pos] = [];
    counts[p.pos].push(i);
  });
  players.forEach((p, i) => {
    const cell = document.getElementById('cell-' + p.pos);
    if (!cell) return;
    const pion = document.createElement('div');
    pion.className = 'pion';
    pion.id = 'pion-' + i;
    pion.style.background = PLAYER_COLORS[i];
    const idx = counts[p.pos].indexOf(i);
    const off = [[-4,-4],[4,-4],[-4,4],[4,4],[0,0]][idx] || [0,0];
    pion.style.left = `calc(50% - ${13 - off[0]}px)`;
    pion.style.top = `calc(50% - ${13 - off[1]}px)`;
    cell.appendChild(pion);
  });
}

function renderDice(val) {
  const dice = document.getElementById('dice');
  dice.innerHTML = '';
  const dots = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[val];
  for(let i=0; i<9; i++){
    const d = document.createElement('div');
    if(dots.includes(i)) d.className = 'dot';
    dice.appendChild(d);
  }
}

function renderPlayerCards() {
  const container = document.getElementById('playerCards');
  container.innerHTML = '';
  players.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = `player-card flex items-center gap-3 ${i === currentPlayer ? 'active' : ''}`;
    card.style.background = PLAYER_COLORS[i] + '20';
    card.innerHTML = `<span class="text-2xl">${PLAYER_EMOJIS[i]}</span><div class="flex-1"><div class="font-bold text-sm" style="color:${PLAYER_COLORS[i]}">${PLAYER_NAMES[i]}</div><div class="text-xs text-gray-500">Kotak ${p.pos} • ⭐ ${p.score} poin</div></div>`;
    container.appendChild(card);
  });
}

function startGame() {
  initAudio();
  players = [];
  for (let i = 0; i < numPlayers; i++) players.push({pos: 1, score: 0});
  currentPlayer = 0;
  gameActive = true;
  shuffledQs = shuffle(ALL_QUESTIONS);
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  buildBoard();
  placePions();
  renderDice(1);
  renderPlayerCards();
  if (window.lucide) lucide.createIcons();
}

function resetGame() {
  location.reload();
}

async function rollDice() {
  if (!gameActive || rolling) return;
  rolling = true;
  document.getElementById('rollBtn').disabled = true;
  sfxDice();
  const dice = document.getElementById('dice');
  dice.classList.add('dice-rolling');
  let val = 1;
  for (let i = 0; i < 8; i++) {
    await new Promise(r => setTimeout(r, 60));
    val = Math.floor(Math.random() * 6) + 1;
    renderDice(val);
  }
  dice.classList.remove('dice-rolling');
  const p = players[currentPlayer];
  let target = Math.min(p.pos + val, 30);
  await animateMove(currentPlayer, p.pos, target);
  p.pos = target;
  if (p.pos === 30) { sfxWin(); showWin(currentPlayer); return; }
  showQuestion(() => {
    const sDest = SNAKES[p.pos], lDest = LADDERS[p.pos];
    if (sDest) {
      sfxSnake();
      setTimeout(async () => { await animateMove(currentPlayer, p.pos, sDest); p.pos = sDest; placePions(); nextTurn(); }, 1000);
    } else if (lDest) {
      sfxLadder();
      setTimeout(async () => { await animateMove(currentPlayer, p.pos, lDest); p.pos = lDest; placePions(); if(p.pos===30) showWin(currentPlayer); else nextTurn(); }, 1000);
    } else nextTurn();
  });
}

async function animateMove(pi, from, to) {
  let cur = from;
  const step = from < to ? 1 : -1;
  while (cur !== to) {
    cur += step;
    players[pi].pos = cur;
    placePions();
    sfxStep();
    await new Promise(r => setTimeout(r, 150));
  }
}

function nextTurn() {
  currentPlayer = (currentPlayer + 1) % numPlayers;
  rolling = false;
  renderPlayerCards();
  document.getElementById('rollBtn').disabled = false;
  document.getElementById('turnLabel').innerHTML = `Giliran: ${PLAYER_EMOJIS[currentPlayer]} <b>${PLAYER_NAMES[currentPlayer]}</b>`;
}

function showQuestion(cb) {
  const q = shuffledQs[qIndex++ % shuffledQs.length];
  document.getElementById('qText').textContent = q.q;
  const opts = document.getElementById('qOptions');
  opts.innerHTML = '';
  q.o.forEach((o, i) => {
    const btn = document.createElement('button');
    btn.className = 'w-full text-left px-4 py-3 rounded-xl border-2 hover:bg-purple-50 transition';
    btn.innerHTML = `<b>${['A','B','C','D'][i]}</b>. ${o}`;
    btn.onclick = () => {
      if(i === q.a) { players[currentPlayer].score += 10; sfxCorrect(); } else { sfxWrong(); }
      document.getElementById('questionOverlay').classList.add('hidden');
      cb();
    };
    opts.appendChild(btn);
  });
  document.getElementById('questionOverlay').classList.remove('hidden');
}

function showWin(pi) {
  document.getElementById('winOverlay').classList.remove('hidden');
  document.getElementById('winText').innerHTML = `Pemain ${PLAYER_NAMES[pi]} Menang!`;
}

if (window.lucide) lucide.createIcons();
</script>
