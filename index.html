<!doctype html>
<html lang="id">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ular Tangga Full Screen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Fredoka', sans-serif; box-sizing: border-box; margin: 0; padding: 0; }
    
    /* Memaksa body benar-benar penuh dan tidak bisa di-scroll */
    html, body { 
      height: 100vh; 
      width: 100vw; 
      overflow: hidden; 
      position: relative;
      background: #1e293b; 
    }

    /* Papan sebagai kontainer utama yang memenuhi layar */
    .game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fef3c7, #fbcfe8, #ddd6fe, #bfdbfe);
      padding: 10px;
    }

    #board { 
      display: grid; 
      grid-template-columns: repeat(6, 1fr); 
      grid-template-rows: repeat(5, 1fr);
      gap: 4px; 
      width: 100%;
      height: 100%; /* Papan dipaksa memenuhi tinggi layar */
      max-width: 100%;
    }

    .board-cell {
      position: relative;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: clamp(12px, 3vh, 28px);
      border: 2px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.2);
    }

    /* Kontrol Melayang (Floating UI) */
    .floating-controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      pointer-events: none; /* Supaya tidak menghalangi klik ke papan kecuali tombolnya */
    }

    .dice-box {
      pointer-events: auto;
      background: white;
      padding: 15px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
      border: 4px solid #fbbf24;
    }

    .dice-face {
      width: 60px;
      height: 60px;
      margin: 0 auto 10px;
      background: white;
      display: grid;
      place-items: center;
      font-size: 30px;
      border: 2px solid #eee;
      border-radius: 10px;
      cursor: pointer;
    }

    .pion {
      position: absolute;
      width: clamp(20px, 4vh, 35px);
      height: clamp(20px, 4vh, 35px);
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 50;
      transition: all 0.5s ease;
    }

    .cell-label { position: absolute; top: 2px; left: 4px; opacity: 0.6; font-size: 0.8rem; }
    .cell-emoji { font-size: 1.5rem; }

    /* Overlay Pertanyaan */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }
  </style>
 </head>
 <body>

  <div class="game-canvas">
    <div id="board"></div>
  </div>

  <div class="floating-controls">
    <div class="dice-box">
      <div id="dice" class="dice-face" onclick="rollDice()">🎲</div>
      <button onclick="rollDice()" class="bg-blue-600 text-white px-4 py-2 rounded-full font-bold text-sm">KOCOK</button>
      <div id="turnInfo" class="mt-2 text-xs font-bold text-red-600">Pemain 1</div>
    </div>
  </div>

  <div id="questionOverlay" class="overlay hidden">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center">
      <p id="qText" class="text-lg font-bold mb-6"></p>
      <div id="qOptions" class="flex flex-col gap-3"></div>
    </div>
  </div>

  <script>
    const COLORS = ['#FFADAD', '#FFD6A5', '#FDFFB6', '#CAFFBF', '#9BF6FF', '#A0C4FF'];
    const SNAKES = {17:7, 24:14, 29:11};
    const LADDERS = {3:12, 8:26, 15:25};
    const QUESTIONS = [
      {q:"Es mencair karena...", o:["Panas","Dingin"], a:0},
      {q:"Air jadi es disebut...", o:["Menguap","Membeku"], a:1},
      {q:"Benda gas mengisi...", o:["Wadah","Ruang"], a:1}
    ];

    let players = [{pos: 1, color: '#ef4444'}, {pos: 1, color: '#3b82f6'}];
    let currentPlayer = 0;
    let rolling = false;

    function initBoard() {
      const board = document.getElementById('board');
      for (let i = 1; i <= 30; i++) {
        const cell = document.createElement('div');
        cell.className = 'board-cell';
        cell.id = 'cell-' + i;
        cell.style.backgroundColor = COLORS[i % COLORS.length];
        
        let icon = '';
        if(SNAKES[i]) icon = '🐍';
        if(LADDERS[i]) icon = '🪜';
        
        cell.innerHTML = `
          <span class="cell-label">${i}</span>
          <span class="cell-emoji">${icon}</span>
        `;
        board.appendChild(cell);
      }
      drawPlayers();
    }

    function drawPlayers() {
      document.querySelectorAll('.pion').forEach(p => p.remove());
      players.forEach((p, i) => {
        const cell = document.getElementById('cell-' + p.pos);
        const pion = document.createElement('div');
        pion.className = 'pion';
        pion.style.backgroundColor = p.color;
        // Posisi sedikit berbeda agar tidak menumpuk sempurna
        pion.style.marginTop = (i * 10) + 'px';
        pion.style.marginLeft = (i * 10) + 'px';
        cell.appendChild(pion);
      });
    }

    async function rollDice() {
      if(rolling) return;
      rolling = true;
      const dice = document.getElementById('dice');
      
      // Animasi sederhana
      for(let i=0; i<6; i++) {
        dice.innerText = Math.floor(Math.random()*6)+1;
        await new Promise(r => setTimeout(r, 100));
      }
      
      const val = Math.floor(Math.random() * 6) + 1;
      dice.innerText = val;
      
      movePlayer(val);
    }

    async function movePlayer(val) {
      let p = players[currentPlayer];
      for(let i=0; i<val; i++) {
        if(p.pos < 30) {
          p.pos++;
          drawPlayers();
          await new Promise(r => setTimeout(r, 300));
        }
      }

      if(p.pos === 30) {
        alert("Pemain " + (currentPlayer+1) + " Menang!");
        location.reload();
        return;
      }

      showQuestion();
    }

    function showQuestion() {
      const q = QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)];
      document.getElementById('qText').innerText = q.q;
      const opts = document.getElementById('qOptions');
      opts.innerHTML = '';
      
      q.o.forEach((o, i) => {
        const btn = document.createElement('button');
        btn.className = "w-full p-3 bg-blue-100 rounded-xl font-bold";
        btn.innerText = o;
        btn.onclick = () => {
          document.getElementById('questionOverlay').classList.add('hidden');
          checkSpecialCells();
        };
        opts.appendChild(btn);
      });
      document.getElementById('questionOverlay').classList.remove('hidden');
    }

    function checkSpecialCells() {
      let p = players[currentPlayer];
      if(SNAKES[p.pos]) p.pos = SNAKES[p.pos];
      if(LADDERS[p.pos]) p.pos = LADDERS[p.pos];
      
      drawPlayers();
      currentPlayer = (currentPlayer + 1) % players.length;
      document.getElementById('turnInfo').innerText = "Pemain " + (currentPlayer + 1);
      document.getElementById('turnInfo').style.color = players[currentPlayer].color;
      rolling = false;
    }

    initBoard();
  </script>
 </body>
</html>
