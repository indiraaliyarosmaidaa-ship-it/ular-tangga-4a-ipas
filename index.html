<!doctype html>
<html lang="id">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ular Tangga Full Papan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Menghilangkan scroll dan memastikan layar penuh */
    * { font-family: 'Fredoka', sans-serif; box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100vh; width: 100vw; overflow: hidden; background: #f0f9ff; }

    /* Container utama yang membungkus papan agar selalu penuh */
    .full-game-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fef3c7, #ddd6fe);
      padding: 5px;
    }

    /* Grid papan dipaksa memenuhi area layar yang tersedia */
    #board { 
      display: grid; 
      grid-template-columns: repeat(6, 1fr); 
      grid-template-rows: repeat(5, 1fr);
      gap: 4px; 
      width: 100%;
      height: 100%;
      max-width: 100%;
    }

    .board-cell {
      position: relative;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: clamp(14px, 4vh, 32px);
      border: 2px solid rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.2);
    }

    /* Kontrol dadu diletakkan melayang (floating) agar tidak membagi layar */
    .dice-container {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      background: white;
      padding: 15px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      border: 4px solid #fbbf24;
      text-align: center;
    }

    .dice-face {
      width: 60px;
      height: 60px;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .pion {
      position: absolute;
      width: clamp(20px, 5vh, 40px);
      height: clamp(20px, 5vh, 40px);
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 50;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cell-num { position: absolute; top: 2px; left: 5px; opacity: 0.5; font-size: 0.7rem; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
  </style>
 </head>
 <body>

  <div class="full-game-wrapper">
    <div id="board"></div>

    <div class="dice-container">
      <div id="dice" class="dice-face" onclick="rollDice()">🎲</div>
      <button onclick="rollDice()" class="bg-orange-500 text-white px-5 py-2 rounded-full font-bold shadow-lg active:scale-95 transition">KOCOK</button>
      <div id="turnTag" class="text-xs font-bold mt-2 text-red-600">Giliran: P1</div>
    </div>
  </div>

  <div id="questionOverlay" class="overlay hidden">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center">
      <h3 class="text-xl font-bold text-purple-700 mb-4">❓ Pertanyaan</h3>
      <p id="qText" class="text-lg font-medium mb-6 text-gray-800"></p>
      <div id="qOptions" class="flex flex-col gap-3"></div>
    </div>
  </div>

  <script>
    const COLORS = ['#fca5a5','#fdba74','#fcd34d','#86efac','#7dd3fc','#c4b5fd'];
    const QUESTIONS = [
      {q:"Es mencair karena suhu...", o:["Panas","Dingin"], a:0},
      {q:"Uap air menjadi titik air disebut...", o:["Membeku","Mengembun"], a:1},
      {q:"Benda padat ke gas disebut...", o:["Menyublim","Menguap"], a:0}
    ];
    
    const SNAKES = {17:7, 24:14, 29:11};
    const LADDERS = {3:12, 8:26, 15:25};
    
    let players = [{pos:1, color:'#ef4444'}, {pos:1, color:'#3b82f6'}];
    let currentPlayer = 0;
    let isMoving = false;

    // Inisialisasi Papan Langsung Tanpa Klik Apapun
    function init() {
      const board = document.getElementById('board');
      for (let i = 1; i <= 30; i++) {
        const cell = document.createElement('div');
        cell.className = 'board-cell';
        cell.id = 'cell-' + i;
        cell.style.backgroundColor = COLORS[i % COLORS.length];
        
        let label = i;
        if(i === 1) label = "START";
        if(i === 30) label = "FINISH";
        
        let icon = "";
        if(SNAKES[i]) icon = "🐍";
        if(LADDERS[i]) icon = "🪜";

        cell.innerHTML = `<span class="cell-num">${label}</span><span class="text-2xl">${icon}</span>`;
        board.appendChild(cell);
      }
      renderPions();
    }

    function renderPions() {
      document.querySelectorAll('.pion').forEach(p => p.remove());
      players.forEach((p, i) => {
        const cell = document.getElementById('cell-' + p.pos);
        const pion = document.createElement('div');
        pion.className = 'pion';
        pion.style.backgroundColor = p.color;
        // Penyesuaian agar tidak menumpuk pas
        pion.style.transform = `translate(${i * 12}px, ${i * 12}px)`;
        cell.appendChild(pion);
      });
    }

    async function rollDice() {
      if(isMoving) return;
      isMoving = true;
      
      const dice = document.getElementById('dice');
      let val = 1;
      for(let i=0; i<6; i++) {
        val = Math.floor(Math.random() * 6) + 1;
        dice.innerText = val;
        await new Promise(r => setTimeout(r, 100));
      }

      await movePlayer(val);
    }

    async function movePlayer(steps) {
      let p = players[currentPlayer];
      for(let i=0; i<steps; i++) {
        if(p.pos < 30) {
          p.pos++;
          renderPions();
          await new Promise(r => setTimeout(r, 300));
        }
      }

      if(p.pos === 30) {
        alert("Pemain " + (currentPlayer + 1) + " Menang! 🎉");
        location.reload();
        return;
      }

      showQuestion();
    }

    function showQuestion() {
      const q = QUESTIONS[Math.floor(Math.random() * QUESTIONS.length)];
      document.getElementById('qText').innerText = q.q;
      const opts = document.getElementById('qOptions');
      opts.innerHTML = '';
      
      q.o.forEach((o, i) => {
        const btn = document.createElement('button');
        btn.className = "w-full p-4 bg-purple-100 hover:bg-purple-200 rounded-2xl font-bold text-purple-700 transition";
        btn.innerText = o;
        btn.onclick = () => {
          document.getElementById('questionOverlay').classList.add('hidden');
          checkSpecialCells();
        };
        opts.appendChild(btn);
      });
      document.getElementById('questionOverlay').classList.remove('hidden');
    }

    function checkSpecialCells() {
      let p = players[currentPlayer];
      if(SNAKES[p.pos]) p.pos = SNAKES[p.pos];
      if(LADDERS[p.pos]) p.pos = LADDERS[p.pos];
      
      renderPions();
      currentPlayer = (currentPlayer + 1) % players.length;
      document.getElementById('turnTag').innerText = "Giliran: P" + (currentPlayer + 1);
      document.getElementById('turnTag').style.color = players[currentPlayer].color;
      isMoving = false;
    }

    init();
  </script>
 </body>
</html>
