<!-- TAMBAHKAN / GANTI BAGIAN SCRIPT DENGAN YANG INI -->
<script>

const COLS = 6;
const ROWS = 5;
const TOTAL = 30;

const PLAYER_COLORS = [
  '#ef4444',
  '#3b82f6',
  '#10b981',
  '#f59e0b',
  '#8b5cf6'
];

const PLAYER_EMOJIS = [
  '🔴','🔵','🟢','🟡','🟣'
];

const CELL_EMOJIS = [
  '🧊','☀️','❄️','☁️','🌧️',
  '💧','🔥','🫧','🕯️','🧈'
];

const SNAKES = {
  17:7,
  24:14,
  29:11,
  20:6
};

const LADDERS = {
  3:12,
  8:26,
  15:25,
  19:28
};

const QUESTIONS = [

{
q:"Padat menjadi cair disebut…",
o:["Membeku","Mencair","Mengembun","Menyublim"],
a:1
},

{
q:"Es batu di tempat terbuka akan…",
o:["Membeku","Mencair","Menguap","Menyublim"],
a:1
},

{
q:"Air mendidih berubah menjadi…",
o:["Es","Minyak","Uap air","Embun"],
a:2
},

{
q:"Gas menjadi cair disebut…",
o:["Mencair","Mengembun","Membeku","Menyublim"],
a:1
},

{
q:"Kapur barus mengecil termasuk…",
o:["Menguap","Menyublim","Membeku","Mengembun"],
a:1
},

{
q:"Air di freezer menjadi…",
o:["Uap","Es","Embun","Gas"],
a:1
},

{
q:"Contoh penguapan adalah…",
o:["Es batu","Air panas","Kayu","Batu"],
a:1
},

{
q:"Mentega dipanaskan akan…",
o:["Membeku","Mencair","Mengembun","Menyublim"],
a:1
},

{
q:"Pakaian dijemur agar airnya…",
o:["Membeku","Menguap","Menyublim","Mengembun"],
a:1
},

{
q:"Es krim terkena panas akan…",
o:["Mencair","Membeku","Menyublim","Mengembun"],
a:0
}

];

let numPlayers = 5;
let players = [];
let currentPlayer = 0;
let rolling = false;
let gameActive = false;

let audioCtx = null;
let musicOn = false;
let musicInterval = null;

function initAudio(){

  if(!audioCtx){

    try{
      audioCtx =
      new(window.AudioContext ||
      window.webkitAudioContext)();

    }catch(e){
      console.log(e);
    }
  }

  if(audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
}

function playTone(freq,dur,type='sine',vol=0.08){

  try{

    initAudio();

    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();

    o.type = type;
    o.frequency.value = freq;

    g.gain.value = vol;

    o.connect(g);
    g.connect(audioCtx.destination);

    o.start();

    g.gain.exponentialRampToValueAtTime(
      0.001,
      audioCtx.currentTime + dur
    );

    o.stop(audioCtx.currentTime + dur);

  }catch(e){}
}

function sfxDice(){
  playTone(300,.1,'square');
  setTimeout(()=>playTone(500,.1,'square'),100);
}

function sfxCorrect(){
  playTone(523,.1);
  setTimeout(()=>playTone(659,.1),100);
  setTimeout(()=>playTone(784,.2),200);
}

function sfxWrong(){
  playTone(220,.3,'sawtooth');
}

function sfxSnake(){
  playTone(300,.1);
  setTimeout(()=>playTone(200,.2),100);
}

function sfxLadder(){
  playTone(300,.1);
  setTimeout(()=>playTone(450,.1),100);
  setTimeout(()=>playTone(650,.2),200);
}

function sfxWin(){
  playTone(523,.15);
  setTimeout(()=>playTone(659,.15),120);
  setTimeout(()=>playTone(784,.3),240);
}

function toggleMusic(){

  musicOn = !musicOn;

  const btn =
  document.getElementById('musicBtn');

  if(musicOn){

    btn.innerHTML =
    '<i data-lucide="volume-2"></i>';

    startMusic();

  }else{

    btn.innerHTML =
    '<i data-lucide="volume-x"></i>';

    stopMusic();
  }

  if(window.lucide){
    lucide.createIcons();
  }
}

function startMusic(){

  if(musicInterval) return;

  const melody = [
    262,294,330,392
  ];

  let i = 0;

  musicInterval = setInterval(()=>{

    playTone(
      melody[i % melody.length],
      .15,
      'sine',
      .03
    );

    i++;

  },400);
}

function stopMusic(){

  clearInterval(musicInterval);

  musicInterval = null;
}

function cellToGrid(cell){

  const idx = cell - 1;

  const row =
  Math.floor(idx / COLS);

  const col = idx % COLS;

  const actualRow =
  ROWS - 1 - row;

  const actualCol =
  row % 2 === 0
  ? col
  : COLS - 1 - col;

  return {
    row:actualRow,
    col:actualCol
  };
}

function buildBoard(){

  const board =
  document.getElementById('board');

  board.innerHTML = '';

  const cells =
  new Array(ROWS)
  .fill(null)
  .map(()=>new Array(COLS).fill(null));

  for(let n=1;n<=TOTAL;n++){

    const {row,col} =
    cellToGrid(n);

    const div =
    document.createElement('div');

    div.className =
    'board-cell';

    div.id = 'cell-'+n;

    div.style.background =
    `hsl(${n*12},85%,75%)`;

    let label = n;

    if(n===1) label = '🚀 START';
    if(n===30) label = '🏁 FINISH';

    let emoji =
    CELL_EMOJIS[
      (n-1) %
      CELL_EMOJIS.length
    ];

    if(SNAKES[n]) emoji='🐍';
    if(LADDERS[n]) emoji='🪜';

    div.innerHTML = `
      <span class="cell-num">
        ${label}
      </span>

      <span style="
        position:absolute;
        bottom:2px;
        right:4px;
        font-size:16px;
      ">
        ${emoji}
      </span>
    `;

    cells[row][col] = div;
  }

  for(let r=0;r<ROWS;r++){

    for(let c=0;c<COLS;c++){

      board.appendChild(
        cells[r][c]
      );
    }
  }
}

function startGame(){

  document.body.addEventListener(
    'click',
    ()=>{ initAudio(); },
    { once:true }
  );

  players = [];

  for(let i=0;i<numPlayers;i++){

    players.push({
      pos:1,
      score:0
    });
  }

  currentPlayer = 0;

  gameActive = true;

  document.getElementById('setupScreen')
  .classList.add('hidden');

  document.getElementById('gameScreen')
  .classList.remove('hidden');

  buildBoard();

  renderDice(1);

  placePions();

  renderCards();

  updateTurn();

  if(window.lucide){
    lucide.createIcons();
  }
}

function placePions(){

  document
  .querySelectorAll('.pion')
  .forEach(p=>p.remove());

  const counts = {};

  players.forEach((p,i)=>{

    if(!counts[p.pos]){
      counts[p.pos] = [];
    }

    counts[p.pos].push(i);
  });

  players.forEach((p,i)=>{

    const cell =
    document.getElementById(
      'cell-'+p.pos
    );

    if(!cell) return;

    const pion =
    document.createElement('div');

    pion.className = 'pion';

    pion.style.background =
    PLAYER_COLORS[i];

    const idx =
    counts[p.pos].indexOf(i);

    const offsets = [
      [-8,-8],
      [8,-8],
      [-8,8],
      [8,8],
      [0,0]
    ];

    const off =
    offsets[idx];

    pion.style.left =
    `calc(50% + ${off[0]}px)`;

    pion.style.top =
    `calc(50% + ${off[1]}px)`;

    cell.appendChild(pion);
  });
}

function renderDice(val){

  const dice =
  document.getElementById('dice');

  dice.innerHTML = `
    <div style="
      font-size:42px;
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
    ">
      ${val}
    </div>
  `;
}

function renderCards(){

  const wrap =
  document.getElementById(
    'playerCards'
  );

  wrap.innerHTML = '';

  players.forEach((p,i)=>{

    const div =
    document.createElement('div');

    div.className =
    'player-card';

    div.style.background =
    PLAYER_COLORS[i]+'22';

    div.innerHTML = `
      <b style="
        color:${PLAYER_COLORS[i]}
      ">
        ${PLAYER_EMOJIS[i]}
        Pemain ${i+1}
      </b>
      <br>
      Kotak ${p.pos}
      <br>
      ⭐ ${p.score}
    `;

    wrap.appendChild(div);
  });
}

function updateTurn(){

  document.getElementById(
    'turnLabel'
  ).innerHTML =
  `Giliran:
  ${PLAYER_EMOJIS[currentPlayer]}
  Pemain ${currentPlayer+1}`;
}

async function rollDice(){

  if(rolling || !gameActive)
  return;

  rolling = true;

  initAudio();

  sfxDice();

  let val = 1;

  for(let i=0;i<10;i++){

    await new Promise(
      r=>setTimeout(r,70)
    );

    val =
    Math.floor(Math.random()*6)+1;

    renderDice(val);
  }

  const player =
  players[currentPlayer];

  let target =
  player.pos + val;

  if(target > 30)
    target = 30;

  await movePlayer(
    currentPlayer,
    player.pos,
    target
  );

  player.pos = target;

  placePions();

  if(player.pos === 30){

    sfxWin();

    showWin();

    return;
  }

  showQuestion();
}

async function movePlayer(pi,from,to){

  let step =
  from < to ? 1 : -1;

  let cur = from;

  while(cur !== to){

    cur += step;

    players[pi].pos = cur;

    placePions();

    await new Promise(
      r=>setTimeout(r,250)
    );
  }
}

function showQuestion(){

  const q =
  QUESTIONS[
    Math.floor(
      Math.random() *
      QUESTIONS.length
    )
  ];

  document.getElementById(
    'questionOverlay'
  ).classList.remove('hidden');

  document.getElementById(
    'qText'
  ).textContent = q.q;

  const wrap =
  document.getElementById(
    'qOptions'
  );

  wrap.innerHTML = '';

  q.o.forEach((opt,i)=>{

    const btn =
    document.createElement('button');

    btn.className =
    'border-2 rounded-xl px-4 py-3 text-left hover:bg-purple-100 font-bold';

    btn.innerHTML =
    `${String.fromCharCode(65+i)}.
    ${opt}`;

    btn.onclick =
    ()=>answerQuestion(
      i,
      q.a
    );

    wrap.appendChild(btn);
  });
}

async function answerQuestion(
chosen,
correct
){

  document.getElementById(
    'questionOverlay'
  ).classList.add('hidden');

  const p =
  players[currentPlayer];

  if(chosen === correct){

    p.score += 10;

    sfxCorrect();

    alert(
      '✅ Benar! +10 poin'
    );

  }else{

    sfxWrong();

    alert(
      '❌ Salah!'
    );
  }

  if(SNAKES[p.pos]){

    sfxSnake();

    alert(
      '🐍 Turun!'
    );

    await movePlayer(
      currentPlayer,
      p.pos,
      SNAKES[p.pos]
    );

    p.pos =
    SNAKES[p.pos];
  }

  if(LADDERS[p.pos]){

    sfxLadder();

    alert(
      '🪜 Naik!'
    );

    await movePlayer(
      currentPlayer,
      p.pos,
      LADDERS[p.pos]
    );

    p.pos =
    LADDERS[p.pos];
  }

  placePions();

  renderCards();

  currentPlayer =
  (currentPlayer+1)
  % numPlayers;

  updateTurn();

  rolling = false;
}

function showWin(){

  gameActive = false;

  document.body.innerHTML += `
  <div style="
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
  ">
    <div style="
      background:white;
      padding:40px;
      border-radius:30px;
      text-align:center;
      font-size:28px;
      font-weight:bold;
    ">
      🎉🎊🏆<br><br>
      Pemain
      ${currentPlayer+1}
      MENANG!
      <br><br>
      🎊🎉
    </div>
  </div>
  `;
}

function resetGame(){

  location.reload();
}

if(window.lucide){
  lucide.createIcons();
}

</script>
